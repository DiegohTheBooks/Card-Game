<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARD DUELS — V5 Game Card</title>
<style>
:root{--bg:#090b10;--panel:#151a24;--border:#2a3245;--gold:#f5c842;--text:#f0f4fc;--muted:#8a99b3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle,#1a2233,#05070a);color:var(--text);font-family:Segoe UI,Arial;padding:20px}.app{max-width:1400px;margin:auto}.panel{background:#141923e8;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px}h1{letter-spacing:3px}button{padding:10px 15px;border-radius:9px;border:1px solid var(--border);background:#202738;color:white;cursor:pointer;font-weight:700}button.primary{background:linear-gradient(135deg,#f39c12,#d35400)}input{padding:10px;border-radius:8px;border:1px solid var(--border);background:#0d111a;color:white}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#05070a}.body{padding:12px}.stats{display:flex;gap:5px;margin-top:8px}.stat{flex:1;text-align:center;background:#090b10;padding:6px;border-radius:5px}.mana{color:var(--gold)}.muted{color:var(--muted);font-size:12px}.status{padding:12px;border:1px solid var(--border);border-radius:8px;margin-top:12px}.hidden{display:none}
</style></head>
<body><main class="app"><section class="panel"><h1>CARD DUELS <span style="color:var(--gold)">V5</span></h1><p class="muted">Game Card — coleção local integrada ao Álbum</p><div class="toolbar"><button class="primary" id="importSet">Importar conjunto</button><button id="importOne">Importar carta</button><button id="exportSet">Exportar coleção</button><button id="clearAll">Limpar coleção</button><input id="search" placeholder="Pesquisar carta..."></div><input class="hidden" type="file" id="fileSet" accept=".json"><input class="hidden" type="file" id="fileOne" accept=".json"><div id="status" class="status">Inicializando banco V5...</div></section><section class="panel"><h2>Minha coleção <span id="count" class="muted"></span></h2><div id="collection" class="grid"></div></section></main>
<script>
const DB_NAME='CardDuelsV5AlbumDB',DB_VERSION=1,STORE='cards';let db,urls=new Map(),cards=[];
const $=id=>document.getElementById(id);function status(t,ok=false){$('status').textContent=t;$('status').style.color=ok?'#2ecc71':''}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'gameId'});s.createIndex('originalId','originalId',{unique:true})}};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function all(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(c){return new Promise((res,rej)=>{const r=tx('readwrite').put(c);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function delAll(){return new Promise((res,rej)=>{const r=tx('readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function normalize(c){return {originalId:String(c.originalId??c.id??crypto.randomUUID()),gameId:String(c.gameId??crypto.randomUUID()),name:c.name??'Carta sem nome',work:c.work??'',mana:Number(c.mana??0),atk:Number(c.atk??0),def:Number(c.def??0),ability:c.ability??c.skillDescription??'',image:c.image??null,updatedAt:Date.now()}}
async function dataUrlToBlob(v){if(!v)return null;if(v instanceof Blob)return v;const r=await fetch(v);return r.blob()}
async function importCards(payload){let incoming=Array.isArray(payload)?payload:(payload.cards?[...payload.cards]:payload.card?[payload.card]:[]);if(!incoming.length)throw Error('Nenhuma carta encontrada no arquivo.');let added=0,updated=0;for(const raw of incoming){const c=normalize(raw);c.image=await dataUrlToBlob(c.image);const existing=cards.find(x=>x.originalId===c.originalId);if(existing){c.gameId=existing.gameId;updated++}else added++;await put(c)}status(`Importação concluída: ${added} adicionada(s), ${updated} atualizada(s).`,true);await refresh()}
function imageURL(c){if(!c.image)return '';if(urls.has(c.gameId))return urls.get(c.gameId);const u=URL.createObjectURL(c.image);urls.set(c.gameId,u);return u}
function render(){const q=$('search').value.toLowerCase();const list=cards.filter(c=>(c.name+' '+c.work).toLowerCase().includes(q));$('count').textContent=`(${list.length})`;$('collection').innerHTML=list.map(c=>`<article class="card"><img src="${imageURL(c)}" alt=""><div class="body"><b>${escapeHTML(c.name)}</b><div class="muted">${escapeHTML(c.work)}</div><div class="stats"><span class="stat mana">◈ ${c.mana}</span><span class="stat">⚔ ${c.atk}</span><span class="stat">🛡 ${c.def}</span></div><p class="muted">${escapeHTML(c.ability)}</p></div></article>`).join('')||'<p class="muted">Nenhuma carta importada.</p>'}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function refresh(){cards=await all();render()}
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click()}
$('importSet').onclick=()=>$('fileSet').click();$('importOne').onclick=()=>$('fileOne').click();$('fileSet').onchange=async e=>{try{const p=JSON.parse(await e.target.files[0].text());await importCards(p)}catch(err){status('Erro: '+err.message)}};$('fileOne').onchange=async e=>{try{await importCards(JSON.parse(await e.target.files[0].text()))}catch(err){status('Erro: '+err.message)}};$('exportSet').onclick=()=>download('game-card-v5.json',{format:'Um Mundo Além das Páginas — Game Card',schemaVersion:1,gameVersion:5,exportedAt:Date.now(),cards:cards.map(c=>({...c,image:null}))});$('clearAll').onclick=async()=>{if(confirm('Apagar toda a coleção V5?')){await delAll();urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();await refresh();status('Coleção apagada.')}};$('search').oninput=render;
(async()=>{try{await openDB();await refresh();status('Banco V5 pronto.',true)}catch(e){status('Falha ao abrir banco: '+e.message)}})();
</script></body></html>
